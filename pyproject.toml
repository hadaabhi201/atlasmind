[project]
name = "atlasmind"
version = "0.1.0"
description = "A modular reasoning agent using LlamaIndex (no RAG)"
authors = [{ name="Abhishek Hada" }]
requires-python = ">=3.10"
dependencies = [
    "llama-index-llms-openai-like==0.5.3",
    "google-genai==1.50.1",
    "python-dotenv==1.2.1",
    "youtube_transcript_api==1.2.3",
    "pandas==2.3.3",
    "openpyxl==3.1.5",
    "deepgram-sdk==5.3.0",
    "beautifulsoup4==4.14.2",
    "google_search_results==2.4.2",
    "torch==2.9.1"
]

[project.scripts]
atlasmind = "atlasmind.main:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["atlasmind"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = """
    --cov=atlasmind
    --cov-report=term-missing
    --cov-report=html
    -v
    --disable-warnings
"""